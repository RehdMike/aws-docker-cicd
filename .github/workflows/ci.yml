name: CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run tests
        run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t aws-docker-cicd:latest .

  staging:
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::104186810412:role/GithubActionsSSMDeploy
          aws-region: eu-west-1

      - name: Deploy to staging through SSM
        run: |
          aws ssm send-command \
            --instance-ids i-0e7cf31769a444887 \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["sudo -u deploy -H bash -lc '\''/home/deploy/deploy-staging.sh'\''"]' \
            --comment "GitHub Actions staging deployment"

  deploy:
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment: production

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::104186810412:role/GithubActionsSSMDeploy
          aws-region: eu-west-1

      - name: Deploy through SSM
        run: |
          aws ssm send-command \
            --instance-ids i-0e7cf31769a444887 \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["sudo -u deploy -H bash -lc '\''/home/deploy/deploy.sh'\''"]' \
            --comment "GitHub Actions production deployment"