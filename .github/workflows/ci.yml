name: CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run tests
        run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t aws-docker-cicd:latest .

  staging:
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::104186810412:role/GithubActionsSSMDeploy
          aws-region: eu-west-1

      - name: Deploy to staging through SSM
        run: |
          aws ssm send-command \
            --instance-ids i-0e7cf31769a444887 \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["sudo -u deploy -H bash -lc '\''/home/deploy/deploy-staging.sh'\''"]' \
            --comment "GitHub Actions staging deployment"

  deploy:
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment: production

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Diagnose GitHub OIDC claims
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE=$(curl -fsS \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(jq -r '.value' <<< "$RESPONSE")

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Failed to obtain OIDC token"
            exit 1
          fi

          export OIDC_TOKEN="$TOKEN"

          python3 -c '
          import os, json, base64

          token = os.environ["OIDC_TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          print(json.dumps({
              "iss": claims.get("iss"),
              "aud": claims.get("aud"),
              "sub": claims.get("sub")
          }, indent=2))
          '

          unset TOKEN RESPONSE OIDC_TOKEN

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::104186810412:role/GithubActionsSSMDeploy
          aws-region: eu-west-1

      - name: Deploy through SSM
        run: |
          aws ssm send-command \
            --instance-ids i-0e7cf31769a444887 \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["sudo -u deploy -H bash -lc '\''/home/deploy/deploy.sh'\''"]' \
            --comment "GitHub Actions production deployment"